<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List — Exercise 3</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="app">
    <div class="app-header">
      <div>
        <h1>✦ Todo</h1>
        <p class="subtitle">get it done, one number at a time</p>
      </div>
      <button id="theme-toggle" title="Toggle theme">🌙</button>
    </div>

    <div class="input-row">
      <input type="text" id="task-input" placeholder="What needs to be done?" autocomplete="off">
      <button id="add-btn"><span>Add</span></button>
    </div>

    <div class="filter-row" id="filter-row">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list"></ul>

    <p id="empty-state" class="empty-state">No tasks yet — add your first one above ✍️</p>

    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <span id="progress-label">0%</span>
    </div>

    <div class="actions">
      <button id="clear-completed-btn">Clear completed</button>
      <button id="remove-last-btn">Remove last</button>
    </div>

    <p id="counter">Remaining: 0 | Total: 0</p>

    <p id="celebration" class="celebration">🎉 All tasks done — nice work! 🎉</p>
  </div>

  <!-- Toastr for notifications (Bonus 2) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

  <script src="script.js"></script>
</body>
</html>
